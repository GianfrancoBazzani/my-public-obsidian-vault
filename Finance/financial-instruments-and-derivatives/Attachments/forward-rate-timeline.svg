<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="700" height="250" fill="white"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/>
  </marker>
</defs>

<!-- timeline -->
<line x1="80" y1="150" x2="170" y2="150" stroke="#333" stroke-width="2"/>
<line x1="170" y1="150" x2="260" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="3 6"/>
<line x1="260" y1="150" x2="440" y2="150" stroke="#333" stroke-width="2"/>
<line x1="440" y1="150" x2="530" y2="150" stroke="#333" stroke-width="2" stroke-dasharray="3 6"/>
<line x1="530" y1="150" x2="620" y2="150" stroke="#333" stroke-width="2"/>

<!-- ticks -->
<line x1="80" y1="134" x2="80" y2="166" stroke="#333" stroke-width="2"/>
<line x1="350" y1="134" x2="350" y2="166" stroke="#333" stroke-width="2"/>
<line x1="620" y1="134" x2="620" y2="166" stroke="#333" stroke-width="2"/>

<!-- time labels -->
<text x="80" y="195" text-anchor="middle">t<tspan font-size="11" dy="3">0</tspan></text>
<text x="350" y="195" text-anchor="middle">t<tspan font-size="11" dy="3">1</tspan></text>
<text x="620" y="195" text-anchor="middle">t<tspan font-size="11" dy="3">2</tspan></text>

<!-- lower arcs: t0 -> t1 and t1 -> t2 -->
<path d="M82,170 Q215,220 343,170" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M357,170 Q485,220 613,170" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="215" y="232" text-anchor="middle" fill="#1f4fd8">r(t<tspan font-size="11" dy="3">1</tspan><tspan font-size="15" dy="-3">)</tspan></text>
<text x="485" y="232" text-anchor="middle" fill="#1f4fd8">f(t<tspan font-size="11" dy="3">1</tspan><tspan font-size="15" dy="-3">, t</tspan><tspan font-size="11" dy="3">2</tspan><tspan font-size="15" dy="-3">)</tspan></text>

<!-- upper arc: t0 -> t2 -->
<path d="M82,130 Q350,10 616,130" fill="none" stroke="#1f4fd8" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="56" text-anchor="middle" fill="#1f4fd8">r(t<tspan font-size="11" dy="3">2</tspan><tspan font-size="15" dy="-3">)</tspan></text>
</svg>
