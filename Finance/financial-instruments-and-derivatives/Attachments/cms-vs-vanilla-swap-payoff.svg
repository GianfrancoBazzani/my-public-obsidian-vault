<svg xmlns="http://www.w3.org/2000/svg" width="640" height="405" viewBox="0 0 640 405" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img">
<title>Payoff of a vanilla payer swap (concave) and of a CMS (linear) against the swap rate at the fixing date. Both have the same expected payoff, which the swap reaches at the forward swap rate and the CMS at the expected swap rate. The gap between the two rates is the convexity adjustment.</title>
