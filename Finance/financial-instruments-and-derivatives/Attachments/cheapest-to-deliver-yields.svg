<text x="20" y="28" font-weight="bold">Why the cheapest-to-deliver bond depends on the level of yields</text>
<text x="20" y="48" font-size="13" fill="#555">Gross basis = quoted bond price − (futures price × conversion factor), per $100 of face value, at delivery.</text>
<text x="20" y="65" font-size="13" fill="#555">The futures price converges so that the cheapest-to-deliver bond has a gross basis of zero.</text>
