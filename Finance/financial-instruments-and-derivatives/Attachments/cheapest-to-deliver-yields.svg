<text x="294" y="174.7142857142857" text-anchor="middle" font-size="12" fill="#d9480f">high-coupon short bond is cheapest</text>
<text x="545" y="156.7142857142857" text-anchor="middle" font-size="13" fill="#1f4fd8" font-weight="bold">Above 6%</text>
<text x="545" y="174.7142857142857" text-anchor="middle" font-size="12" fill="#1f4fd8">low-coupon long bond is cheapest</text>
<text x="20" y="460" font-weight="bold">Effect of the slope of the yield curve</text>
<text x="20" y="480" font-size="13" fill="#555">Conversion factors assume a flat curve. The bonds with the higher yields have lower prices, so they are cheaper to deliver.</text>
<text x="50" y="505" font-size="13" font-weight="bold">Upward-sloping</text>
