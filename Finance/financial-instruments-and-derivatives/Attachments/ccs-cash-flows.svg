<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="Helvetica, Arial, sans-serif" font-size="15" role="img">
<title>Cash flows of a EUR/USD cross-currency swap between a company and a dealer. At the start, the company pays EUR 85 million and receives USD 100 million at the spot rate. Each quarter, the company pays SOFR on USD 100 million and receives €STR plus the basis b on EUR 85 million. At maturity, the company pays back USD 100 million and receives back EUR 85 million at the initial spot rate.</title>
<rect width="820" height="330" fill="white"/>
<defs>
  <marker id="eur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd8"/></marker>
  <marker id="usd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker>
</defs>

<text x="20" y="29" font-weight="bold">Cash flows of a EUR/USD cross-currency swap</text>
<line x1="620" y1="24" x2="650" y2="24" stroke="#1f4fd8" stroke-width="2.5"/>
<text x="658" y="29" font-size="13">EUR</text>
<line x1="710" y1="24" x2="740" y2="24" stroke="#d9480f" stroke-width="2.5"/>
<text x="748" y="29" font-size="13">USD</text>

<!-- panel separators -->
<line x1="275" y1="58" x2="275" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="545" y1="58" x2="545" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>

<!-- panel titles -->
<text x="140" y="72" text-anchor="middle" font-weight="bold">1. Start</text>
<text x="410" y="72" text-anchor="middle" font-weight="bold">2. Each quarter</text>
<text x="680" y="72" text-anchor="middle" font-weight="bold">3. Maturity</text>

<!-- company boxes -->
<rect x="80" y="88" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="140" y="115" text-anchor="middle" font-weight="bold">Company</text>
<rect x="350" y="88" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="410" y="115" text-anchor="middle" font-weight="bold">Company</text>
<rect x="620" y="88" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="680" y="115" text-anchor="middle" font-weight="bold">Company</text>

<!-- dealer boxes -->
<rect x="80" y="230" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="140" y="257" text-anchor="middle" font-weight="bold">Dealer</text>
<rect x="350" y="230" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="410" y="257" text-anchor="middle" font-weight="bold">Dealer</text>
<rect x="620" y="230" width="120" height="44" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="680" y="257" text-anchor="middle" font-weight="bold">Dealer</text>

<!-- 1. start: principals at the spot rate -->
<line x1="110" y1="135" x2="110" y2="227" stroke="#1f4fd8" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="100" y="185" font-size="13" text-anchor="end" fill="#1f4fd8">EUR 85M</text>
<line x1="170" y1="227" x2="170" y2="135" stroke="#d9480f" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="180" y="185" font-size="13" fill="#d9480f">USD 100M</text>

<!-- 2. each quarter: interest -->
<line x1="380" y1="135" x2="380" y2="227" stroke="#d9480f" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="370" y="177" font-size="13" text-anchor="end" fill="#d9480f">SOFR</text>
<text x="370" y="194" font-size="13" text-anchor="end" fill="#d9480f">on USD 100M</text>
<line x1="440" y1="227" x2="440" y2="135" stroke="#1f4fd8" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="450" y="177" font-size="13" fill="#1f4fd8">€STR + b</text>
<text x="450" y="194" font-size="13" fill="#1f4fd8">on EUR 85M</text>

<!-- 3. maturity: principals back at the initial spot rate -->
<line x1="650" y1="135" x2="650" y2="227" stroke="#d9480f" stroke-width="2.2" marker-end="url(#usd)"/>
<text x="640" y="185" font-size="13" text-anchor="end" fill="#d9480f">USD 100M</text>
<line x1="710" y1="227" x2="710" y2="135" stroke="#1f4fd8" stroke-width="2.2" marker-end="url(#eur)"/>
<text x="720" y="185" font-size="13" fill="#1f4fd8">EUR 85M</text>

<!-- notes -->
<text x="140" y="300" text-anchor="middle" font-size="13" fill="#555">at the spot rate 1.1765</text>
<text x="410" y="300" text-anchor="middle" font-size="13" fill="#555">interest in each currency</text>
<text x="680" y="300" text-anchor="middle" font-size="13" fill="#555">at the same rate 1.1765</text>
</svg>
