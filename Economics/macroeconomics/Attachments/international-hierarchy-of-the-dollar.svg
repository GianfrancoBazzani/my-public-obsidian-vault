<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The international hierarchy of the dollar as a pyramid with five layers, from the Fed dollar at the top to national money and credit at the base</title>
<defs>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#333"/>
</marker>
</defs>
<rect width="860" height="470" fill="white"/>

<text x="20" y="30" font-size="15" font-weight="bold" fill="#333">The international hierarchy of the dollar</text>

<line x1="28" y1="400" x2="28" y2="76" stroke="#333" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
<text x="28" y="62" text-anchor="middle" fill="#555">money</text>
<text x="28" y="420" text-anchor="middle" fill="#555">credit</text>

<polygon points="300,60 248,128 352,128" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<polygon points="248,128 352,128 404,196 196,196" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<polygon points="196,196 404,196 456,264 144,264" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<polygon points="144,264 456,264 508,332 92,332" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<polygon points="92,332 508,332 560,400 40,400" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>

<g text-anchor="middle" fill="#333">
<text x="300" y="117">Fed dollar</text>
<text x="300" y="167">C6 swap lines</text>
<text x="300" y="235">Bilateral swap lines</text>
<text x="300" y="303">Regional arrangements and the IMF</text>
<text x="300" y="371">National money and credit</text>
</g>

<g stroke="#adb5bd" stroke-width="1">
<line x1="337" y1="112" x2="590" y2="112"/>
<line x1="352" y1="162" x2="590" y2="162"/>
<line x1="366" y1="230" x2="590" y2="230"/>
<line x1="413" y1="298" x2="590" y2="298"/>
<line x1="388" y1="366" x2="590" y2="366"/>
</g>

<g font-size="12" fill="#555">
<text x="596" y="108">Reserves at the Fed, the final means</text>
<text x="596" y="123">of settlement for dollars</text>
<text x="596" y="158">Standing swap lines among the Fed, the ECB</text>
<text x="596" y="173">and the central banks of Japan, the United</text>
<text x="596" y="188">Kingdom, Switzerland and Canada since 2013</text>
<text x="596" y="226">Lines between other central banks, many in</text>
<text x="596" y="241">local currencies, which save dollars but do</text>
<text x="596" y="256">not create them</text>
<text x="596" y="294">Swaps that the countries of a region</text>
<text x="596" y="309">commit to each other, such as the Chiang</text>
<text x="596" y="324">Mai Initiative, and the lending of the IMF</text>
<text x="596" y="362">The money and credit of each country,</text>
<text x="596" y="377">which needs dollars to pay abroad</text>
</g>

<rect x="40" y="436" width="22" height="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="70" y="448" font-size="12" fill="#555">Permanent access to Fed dollars</text>
<rect x="300" y="436" width="22" height="14" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="330" y="448" font-size="12" fill="#555">No guaranteed access, so own reserves are the first defense</text>
</svg>
