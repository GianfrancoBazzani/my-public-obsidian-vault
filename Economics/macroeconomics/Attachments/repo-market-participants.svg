<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Dealers stand between cash lenders, cash borrowers and holders of securities in demand in the repo market</title>
<defs>
<marker id="arrow-cash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
<marker id="arrow-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
</defs>
<rect width="960" height="470" fill="white"/>
<rect x="30" y="30" width="260" height="180" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="160" y="62" text-anchor="middle" font-weight="bold" fill="#333">Cash lenders</text>
<text x="160" y="92" text-anchor="middle" fill="#555">Money market funds</text>
<text x="160" y="116" text-anchor="middle" fill="#555">Banks</text>
<text x="160" y="140" text-anchor="middle" fill="#555">Asset managers</text>
<text x="160" y="164" text-anchor="middle" fill="#555">Treasuries of large companies</text>
<text x="160" y="188" text-anchor="middle" fill="#555">Other institutional investors</text>
<rect x="400" y="85" width="160" height="90" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="480" y="124" text-anchor="middle" font-weight="bold" fill="#333">Dealers</text>
<text x="480" y="146" text-anchor="middle" fill="#555">market makers</text>
<rect x="670" y="70" width="260" height="120" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="800" y="108" text-anchor="middle" font-weight="bold" fill="#333">Cash borrowers</text>
<text x="800" y="136" text-anchor="middle" fill="#555">Hedge funds and other</text>
<text x="800" y="158" text-anchor="middle" fill="#555">leveraged investors</text>
<line x1="292" y1="112" x2="396" y2="112" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-cash)"/>
<text x="345" y="103" text-anchor="middle" fill="#2b8a3e">Cash</text>
<line x1="398" y1="150" x2="294" y2="150" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-sec)"/>
<text x="345" y="170" text-anchor="middle" fill="#1971c2">Collateral</text>
<text x="345" y="202" text-anchor="middle" fill="#555">Repo for</text>
<text x="345" y="220" text-anchor="middle" fill="#555">the dealer</text>
<line x1="562" y1="112" x2="666" y2="112" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-cash)"/>
<text x="615" y="103" text-anchor="middle" fill="#2b8a3e">Cash</text>
<line x1="668" y1="150" x2="564" y2="150" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-sec)"/>
<text x="615" y="170" text-anchor="middle" fill="#1971c2">Collateral</text>
<text x="615" y="202" text-anchor="middle" fill="#555">Reverse repo</text>
<text x="615" y="220" text-anchor="middle" fill="#555">for the dealer</text>
<rect x="320" y="310" width="320" height="80" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="480" y="342" text-anchor="middle" font-weight="bold" fill="#333">Holders of securities in demand</text>
<text x="480" y="366" text-anchor="middle" fill="#555">such as pension funds and insurers</text>
<line x1="455" y1="308" x2="455" y2="179" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-sec)"/>
<text x="447" y="250" text-anchor="end" fill="#1971c2">Securities</text>
<line x1="505" y1="177" x2="505" y2="306" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-cash)"/>
<text x="513" y="250" fill="#2b8a3e">Cash</text>
<text x="480" y="414" text-anchor="middle" fill="#555">Reverse repo for the dealer</text>
<line x1="30" y1="446" x2="70" y2="446" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-cash)"/>
<text x="80" y="451" fill="#333">Cash</text>
<line x1="140" y1="446" x2="180" y2="446" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-sec)"/>
<text x="190" y="451" fill="#333">Securities</text>
</svg>
