<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>A European bank funds its dollar loans with commercial paper and CDs that a US prime money market fund buys; in a run the fund does not renew the paper, and the central bank swap line replaces the dollars</title>
<defs>
<marker id="arrow-usd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker>
<marker id="arrow-eur" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker>
<marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
</defs>
<rect width="960" height="580" fill="white"/>
<text x="30" y="38" font-size="16" font-weight="bold" fill="#333">Normal times</text>
<rect x="30" y="60" width="200" height="80" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="130" y="94" text-anchor="middle" font-weight="bold" fill="#333">Investors</text>
<text x="130" y="116" text-anchor="middle" fill="#555">buy shares of the fund</text>
<rect x="380" y="60" width="200" height="80" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="480" y="88" text-anchor="middle" font-weight="bold" fill="#333">US prime money</text>
<text x="480" y="106" text-anchor="middle" font-weight="bold" fill="#333">market fund</text>
<text x="480" y="126" text-anchor="middle" fill="#555">buys CP and CDs</text>
<rect x="730" y="60" width="200" height="80" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="830" y="94" text-anchor="middle" font-weight="bold" fill="#333">European bank</text>
<text x="830" y="116" text-anchor="middle" fill="#555">funds its dollar loans</text>
<line x1="232" y1="84" x2="376" y2="84" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="304" y="75" text-anchor="middle" fill="#2b8a3e">Dollars</text>
<line x1="378" y1="118" x2="234" y2="118" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-paper)"/>
<text x="304" y="138" text-anchor="middle" fill="#1971c2">Shares</text>
<line x1="582" y1="84" x2="726" y2="84" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="654" y="75" text-anchor="middle" fill="#2b8a3e">Dollars</text>
<line x1="728" y1="118" x2="584" y2="118" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-paper)"/>
<text x="654" y="138" text-anchor="middle" fill="#1971c2">CP and CDs</text>
<line x1="30" y1="172" x2="930" y2="172" stroke="#dee2e6" stroke-width="1.5"/>
<text x="30" y="208" font-size="16" font-weight="bold" fill="#333">Run on the fund</text>
<rect x="30" y="230" width="200" height="80" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.5"/>
<text x="130" y="264" text-anchor="middle" font-weight="bold" fill="#333">Investors</text>
<text x="130" y="286" text-anchor="middle" fill="#555">redeem their shares</text>
<rect x="380" y="230" width="200" height="80" rx="6" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
<text x="480" y="258" text-anchor="middle" font-weight="bold" fill="#333">US prime money</text>
<text x="480" y="276" text-anchor="middle" font-weight="bold" fill="#333">market fund</text>
<text x="480" y="296" text-anchor="middle" fill="#555">does not renew the paper</text>
<rect x="730" y="230" width="200" height="80" rx="6" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text x="830" y="264" text-anchor="middle" font-weight="bold" fill="#333">European bank</text>
<text x="830" y="286" text-anchor="middle" fill="#c92a2a">loses its dollar funding</text>
<line x1="378" y1="270" x2="234" y2="270" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="304" y="261" text-anchor="middle" fill="#2b8a3e">Redemptions</text>
<line x1="584" y1="270" x2="726" y2="270" stroke="#e03131" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="645" y1="260" x2="665" y2="280" stroke="#e03131" stroke-width="3"/>
<line x1="665" y1="260" x2="645" y2="280" stroke="#e03131" stroke-width="3"/>
<text x="655" y="250" text-anchor="middle" font-weight="bold" fill="#c92a2a">Paper not renewed</text>
<rect x="380" y="400" width="200" height="70" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="480" y="430" text-anchor="middle" font-weight="bold" fill="#333">Federal Reserve</text>
<text x="480" y="452" text-anchor="middle" fill="#555">lends dollars</text>
<rect x="730" y="400" width="200" height="70" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<text x="830" y="430" text-anchor="middle" font-weight="bold" fill="#333">European Central Bank</text>
<text x="830" y="452" text-anchor="middle" fill="#555">lends the dollars on</text>
<line x1="582" y1="420" x2="726" y2="420" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="654" y="411" text-anchor="middle" fill="#2b8a3e">Dollars</text>
<line x1="728" y1="452" x2="584" y2="452" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrow-eur)"/>
<text x="654" y="472" text-anchor="middle" fill="#868e96">Euros</text>
<text x="654" y="496" text-anchor="middle" font-weight="bold" fill="#333">Swap line</text>
<line x1="830" y1="398" x2="830" y2="316" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="842" y="362" fill="#2b8a3e">Dollar loans</text>
<text x="30" y="414" fill="#555">Without the swap line, the bank must</text>
<text x="30" y="434" fill="#555">find dollars at short notice, for</text>
<text x="30" y="454" fill="#555">example with foreign exchange swaps,</text>
<text x="30" y="474" fill="#555">or sell its dollar assets.</text>
<line x1="30" y1="540" x2="70" y2="540" stroke="#2b8a3e" stroke-width="2.5" marker-end="url(#arrow-usd)"/>
<text x="80" y="545" fill="#333">Dollars</text>
<line x1="160" y1="540" x2="200" y2="540" stroke="#868e96" stroke-width="2.5" marker-end="url(#arrow-eur)"/>
<text x="210" y="545" fill="#333">Euros</text>
<line x1="280" y1="540" x2="320" y2="540" stroke="#1971c2" stroke-width="2.5" marker-end="url(#arrow-paper)"/>
<text x="330" y="545" fill="#333">Shares, CP and CDs</text>
</svg>
