<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
<title>Nested intervals A_n = [-1/n, 1/n] on the real line: A_1 = [-1, 1] contains A_2 = [-1/2, 1/2], which contains A_3 = [-1/3, 1/3]</title>
<rect width="600" height="240" fill="white"/>
<g stroke="#d1d5db" stroke-width="1" stroke-dasharray="3 3">
  <line x1="80.0" y1="50" x2="80.0" y2="190"/>
  <line x1="520.0" y1="50" x2="520.0" y2="190"/>
  <line x1="190.0" y1="95" x2="190.0" y2="190"/>
  <line x1="410.0" y1="95" x2="410.0" y2="190"/>
  <line x1="226.7" y1="140" x2="226.7" y2="190"/>
  <line x1="373.3" y1="140" x2="373.3" y2="190"/>
</g>
<line x1="80.0" y1="50" x2="520.0" y2="50" stroke="#2a78d6" stroke-width="3"/>
<g fill="#2a78d6"><circle cx="80.0" cy="50" r="5"/><circle cx="520.0" cy="50" r="5"/></g>
<text x="66.0" y="55" text-anchor="end" font-style="italic">A<tspan font-size="11" dy="4">1</tspan></text>
<line x1="190.0" y1="95" x2="410.0" y2="95" stroke="#2a78d6" stroke-width="3"/>
<g fill="#2a78d6"><circle cx="190.0" cy="95" r="5"/><circle cx="410.0" cy="95" r="5"/></g>
<text x="176.0" y="100" text-anchor="end" font-style="italic">A<tspan font-size="11" dy="4">2</tspan></text>
<line x1="226.7" y1="140" x2="373.3" y2="140" stroke="#2a78d6" stroke-width="3"/>
<g fill="#2a78d6"><circle cx="226.7" cy="140" r="5"/><circle cx="373.3" cy="140" r="5"/></g>
<text x="212.7" y="145" text-anchor="end" font-style="italic">A<tspan font-size="11" dy="4">3</tspan></text>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
  </marker>
</defs>
<line x1="36.0" y1="190" x2="575.0" y2="190" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
<g stroke="#1f2937" stroke-width="1.5">
  <line x1="80.0" y1="185" x2="80.0" y2="195"/>
  <line x1="190.0" y1="185" x2="190.0" y2="195"/>
  <line x1="226.7" y1="185" x2="226.7" y2="195"/>
  <line x1="300.0" y1="185" x2="300.0" y2="195"/>
  <line x1="373.3" y1="185" x2="373.3" y2="195"/>
  <line x1="410.0" y1="185" x2="410.0" y2="195"/>
  <line x1="520.0" y1="185" x2="520.0" y2="195"/>
</g>
<g text-anchor="middle" font-size="13">
  <text x="80.0" y="212">−1</text>
  <text x="190.0" y="212">−1/2</text>
  <text x="226.7" y="212">−1/3</text>
  <text x="300.0" y="212">0</text>
  <text x="373.3" y="212">1/3</text>
  <text x="410.0" y="212">1/2</text>
  <text x="520.0" y="212">1</text>
</g>
<text x="571.0" y="214" font-style="italic" font-size="17">x</text>
</svg>
