<!-- Axes -->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
  </marker>
</defs>
<g stroke="#1f2937" stroke-width="1.5">
  <line x1="90" y1="310" x2="530" y2="310" marker-end="url(#arrow)"/>
  <line x1="90" y1="310" x2="90" y2="40" marker-end="url(#arrow)"/>
</g>
<g font-style="italic" font-size="18">
  <text x="522" y="334">θ</text>
  <text x="68" y="40">x</text>
</g>

<!-- Ticks on the theta axis -->
<g stroke="#1f2937" stroke-width="1.5">
  <line x1="290.0" y1="310" x2="290.0" y2="316"/>
  <line x1="490" y1="310" x2="490" y2="316"/>
</g>
<g text-anchor="middle">
  <text x="90" y="334">0</text>
  <text x="290.0" y="334">π/4</text>
  <text x="490" y="334">π/2</text>
</g>

<!-- Ticks on the x axis -->
<g text-anchor="end">
  <text x="82" y="75" font-style="italic">d/2</text>
  <text x="82" y="123.0" font-style="italic">L/2</text>
</g>

<!-- Labels -->
<g font-weight="bold" text-anchor="middle">
  <text x="338.0" y="250">E</text>
  <text x="110" y="100">Ω</text>
</g>
<text x="290" y="150" font-style="italic" text-anchor="end">x = (L/2) sin θ</text>
</svg>
