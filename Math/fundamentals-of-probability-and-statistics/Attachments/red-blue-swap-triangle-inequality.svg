<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Red and blue points: two crossing segments R1B1 and R2B2 meet at X. After the swap, R1B2 is shorter than R1X + XB2 and R2B1 is shorter than R2X + XB1, by the triangle inequality</title>
<rect width="760" height="400" fill="white"/>

<!-- Panel titles -->
<g font-size="17" font-weight="bold" text-anchor="middle">
  <text x="180" y="30">Crossing pairing</text>
  <text x="560" y="30">Swapped pairing (shorter)</text>
</g>

<!-- Divider -->
<line x1="380" y1="50" x2="380" y2="330" stroke="#e5e7eb" stroke-width="1.5"/>

<!-- Left panel: R1 (50,90), B1 (310,250), R2 (80,270), B2 (290,60), crossing X (180,170) -->
<g transform="translate(0,20)">
  <g stroke="#374151" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="90" x2="310" y2="250"/>
    <line x1="80" y1="270" x2="290" y2="60"/>
  </g>
  <circle cx="180" cy="170" r="4.5" fill="#1f2937"/>
  <circle cx="50" cy="90" r="7" fill="#dc2626"/>
  <circle cx="80" cy="270" r="7" fill="#dc2626"/>
  <circle cx="310" cy="250" r="7" fill="#2563eb"/>
  <circle cx="290" cy="60" r="7" fill="#2563eb"/>
  <g font-style="italic" font-size="18">
    <text x="22" y="86">R₁</text>
    <text x="52" y="296">R₂</text>
    <text x="320" y="270">B₁</text>
    <text x="300" y="52">B₂</text>
    <text x="194" y="176">X</text>
  </g>
</g>

<!-- Right panel: same points shifted by 380 -->
<g transform="translate(380,20)">
  <!-- Triangles R1 X B2 and R2 X B1 -->
  <g fill="#f3f4f6" stroke="none">
    <polygon points="50,90 180,170 290,60"/>
    <polygon points="80,270 180,170 310,250"/>
  </g>
  <!-- Old path through X -->
  <g stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round">
    <line x1="50" y1="90" x2="180" y2="170"/>
    <line x1="180" y1="170" x2="290" y2="60"/>
    <line x1="80" y1="270" x2="180" y2="170"/>
    <line x1="180" y1="170" x2="310" y2="250"/>
  </g>
  <!-- New segments -->
  <g stroke="#16a34a" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="90" x2="290" y2="60"/>
    <line x1="80" y1="270" x2="310" y2="250"/>
  </g>
  <circle cx="180" cy="170" r="4.5" fill="white" stroke="#6b7280" stroke-width="2"/>
  <circle cx="50" cy="90" r="7" fill="#dc2626"/>
  <circle cx="80" cy="270" r="7" fill="#dc2626"/>
  <circle cx="310" cy="250" r="7" fill="#2563eb"/>
  <circle cx="290" cy="60" r="7" fill="#2563eb"/>
  <g font-style="italic" font-size="18">
    <text x="22" y="86">R₁</text>
    <text x="52" y="296">R₂</text>
    <text x="320" y="270">B₁</text>
    <text x="300" y="52">B₂</text>
    <text x="194" y="176" fill="#6b7280">X</text>
  </g>
</g>

<!-- Formulas -->
<g font-size="15" text-anchor="middle">
  <text x="180" y="352">|R₁B₁| + |R₂B₂|</text>
  <text x="180" y="374">= |R₁X| + |XB₁| + |R₂X| + |XB₂|</text>
  <text x="560" y="352">|R₁B₂| &lt; |R₁X| + |XB₂|</text>
  <text x="560" y="374">|R₂B₁| &lt; |R₂X| + |XB₁|</text>
</g>
</svg>
