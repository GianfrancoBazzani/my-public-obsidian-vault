<svg xmlns="http://www.w3.org/2000/svg" width="635" height="520" viewBox="0 0 635 520" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Venn diagrams of the intersection A ∩ B, the union A ∪ B, the difference A \ B and the symmetric difference A △ B inside the universe U</title>
<rect width="635" height="520" fill="white"/>
<defs>
  <circle id="a" cx="120" cy="110" r="70"/>
  <circle id="b" cx="190" cy="110" r="70"/>
  <clipPath id="clipA"><use href="#a"/></clipPath>
  <mask id="notB">
    <rect x="0" y="0" width="310" height="220" fill="white"/>
    <use href="#b" fill="black"/>
  </mask>
  <mask id="notA">
    <rect x="0" y="0" width="310" height="220" fill="white"/>
    <use href="#a" fill="black"/>
  </mask>
  <g id="outline">
    <rect x="5" y="10" width="300" height="200" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="18" y="34" font-weight="bold">U</text>
    <use href="#a" fill="none" stroke="#1f2937" stroke-width="2"/>
    <use href="#b" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="70" y="115" font-weight="bold">A</text>
    <text x="228" y="115" font-weight="bold">B</text>
  </g>
</defs>

<!-- Intersection -->
<g transform="translate(0,0)">
  <use href="#b" fill="#fca5a5" clip-path="url(#clipA)"/>
  <use href="#outline"/>
  <text x="155" y="240" text-anchor="middle">A ∩ B</text>
</g>

<!-- Union -->
<g transform="translate(325,0)">
  <use href="#a" fill="#93c5fd"/>
  <use href="#b" fill="#93c5fd"/>
  <use href="#outline"/>
  <text x="155" y="240" text-anchor="middle">A ∪ B</text>
</g>

<!-- Difference -->
<g transform="translate(0,260)">
  <use href="#a" fill="#86efac" mask="url(#notB)"/>
  <use href="#outline"/>
  <text x="155" y="240" text-anchor="middle">A \ B</text>
</g>

<!-- Symmetric difference -->
<g transform="translate(325,260)">
  <use href="#a" fill="#fcd34d" mask="url(#notB)"/>
  <use href="#b" fill="#fcd34d" mask="url(#notA)"/>
  <use href="#outline"/>
  <text x="155" y="240" text-anchor="middle">A △ B</text>
</g>
</svg>
