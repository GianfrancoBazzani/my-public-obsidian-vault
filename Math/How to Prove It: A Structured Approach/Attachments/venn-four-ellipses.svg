<svg xmlns="http://www.w3.org/2000/svg" width="460" height="365" viewBox="0 0 460 365" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Venn diagram of four sets A, B, C and D drawn as four overlapping ellipses inside the universe U, with all 16 regions and the region (A ∩ D) \ (B ∪ C) shaded</title>
<rect width="460" height="365" fill="white"/>
<defs>
  <ellipse id="a" cx="165" cy="185" rx="150" ry="80" transform="rotate(45 165 185)"/>
  <ellipse id="b" cx="205" cy="160" rx="150" ry="80" transform="rotate(45 205 160)"/>
  <ellipse id="c" cx="255" cy="160" rx="150" ry="80" transform="rotate(-45 255 160)"/>
  <ellipse id="d" cx="295" cy="185" rx="150" ry="80" transform="rotate(-45 295 185)"/>
  <clipPath id="clipD"><use href="#d"/></clipPath>
</defs>
<rect x="5" y="10" width="450" height="320" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
<text x="18" y="34" font-weight="bold">U</text>
<!-- (A ∩ D) \ (B ∪ C): A clipped to D, with B and C painted over in white -->
<g clip-path="url(#clipD)">
  <use href="#a" fill="#86efac"/>
  <use href="#b" fill="white"/>
  <use href="#c" fill="white"/>
</g>
<g fill="none" stroke="#1f2937" stroke-width="2">
  <use href="#a"/>
  <use href="#b"/>
  <use href="#c"/>
  <use href="#d"/>
</g>
<text x="28" y="95" font-weight="bold">A</text>
<text x="76" y="52" font-weight="bold">B</text>
<text x="372" y="52" font-weight="bold">C</text>
<text x="420" y="95" font-weight="bold">D</text>
<text x="230" y="355" text-anchor="middle">(A ∩ D) \ (B ∪ C)</text>
</svg>
