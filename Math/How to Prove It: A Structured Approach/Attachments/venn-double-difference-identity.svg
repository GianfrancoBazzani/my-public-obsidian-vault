<svg xmlns="http://www.w3.org/2000/svg" width="955" height="270" viewBox="0 0 955 270" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Venn diagrams of A \ B, A \ (A \ B) and A ∩ B inside the universe U: the last two shade the same region</title>
<rect width="955" height="270" fill="white"/>
<defs>
  <circle id="a" cx="120" cy="115" r="75"/>
  <circle id="b" cx="190" cy="115" r="75"/>
  <clipPath id="clipB"><use href="#b"/></clipPath>
  <g id="outline">
    <rect x="5" y="10" width="300" height="210" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="18" y="34" font-weight="bold">U</text>
    <use href="#a" fill="none" stroke="#1f2937" stroke-width="2"/>
    <use href="#b" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="60" y="60" font-weight="bold">A</text>
    <text x="238" y="60" font-weight="bold">B</text>
  </g>
</defs>

<!-- A \ B -->
<g transform="translate(0,0)">
  <use href="#a" fill="#93c5fd"/>
  <use href="#b" fill="white"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">A \ B</text>
</g>

<!-- A \ (A \ B): A with the region A \ B removed -->
<g transform="translate(325,0)">
  <use href="#a" fill="#86efac" clip-path="url(#clipB)"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">A \ (A \ B)</text>
</g>

<!-- A ∩ B -->
<g transform="translate(650,0)">
  <use href="#a" fill="#86efac" clip-path="url(#clipB)"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">A ∩ B</text>
</g>
</svg>
