<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Venn diagram inside the universe U: circle A lies inside circle B, and circle C overlaps B but not A</title>
<rect width="440" height="300" fill="white"/>

<!-- U: universe of discourse -->
<rect x="5" y="5" width="430" height="290" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
<text x="18" y="30" font-weight="bold">U</text>

<!-- Fills: B contains A; C is disjoint from A but can overlap B -->
<circle cx="150" cy="155" r="105" fill="#93c5fd"/>
<circle cx="295" cy="155" r="70" fill="#86efac" fill-opacity="0.7"/>
<circle cx="150" cy="170" r="50" fill="#fca5a5"/>

<!-- Outlines on top of all fills -->
<g fill="none" stroke="#1f2937" stroke-width="2">
  <circle cx="150" cy="155" r="105"/>
  <circle cx="295" cy="155" r="70"/>
  <circle cx="150" cy="170" r="50"/>
</g>

<!-- Labels -->
<g text-anchor="middle" font-weight="bold">
  <text x="150" y="80">B</text>
  <text x="150" y="176">A</text>
  <text x="320" y="161">C</text>
</g>
</svg>
