<svg xmlns="http://www.w3.org/2000/svg" width="310" height="290" viewBox="0 0 310 290" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Attempted Venn diagram of four overlapping circles A, B, C and D inside the universe U</title>
<rect width="310" height="290" fill="white"/>
<rect x="5" y="10" width="300" height="270" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
<text x="18" y="34" font-weight="bold">U</text>
<g fill="none" stroke="#1f2937" stroke-width="2">
  <circle cx="115" cy="105" r="85"/>
  <circle cx="195" cy="105" r="85"/>
  <circle cx="115" cy="185" r="85"/>
  <circle cx="195" cy="185" r="85"/>
</g>
<text x="42" y="50" font-weight="bold">A</text>
<text x="256" y="50" font-weight="bold">B</text>
<text x="42" y="262" font-weight="bold">C</text>
<text x="256" y="262" font-weight="bold">D</text>
</svg>
