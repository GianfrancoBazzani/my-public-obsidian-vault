<svg xmlns="http://www.w3.org/2000/svg" width="635" height="540" viewBox="0 0 635 540" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937">
<title>Venn diagrams of B △ C, A △ B, A △ (B △ C) and (A △ B) △ C inside the universe U: the last two shade the same region</title>
<rect width="635" height="540" fill="white"/>
<defs>
  <circle id="a" cx="120" cy="90" r="60"/>
  <circle id="b" cx="190" cy="90" r="60"/>
  <circle id="c" cx="155" cy="150" r="60"/>
  <!-- With fill-rule="evenodd", a point is filled when it is inside an odd number of circles -->
  <path id="bc" fill-rule="evenodd" d="M130,90 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z M95,150 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z"/>
  <path id="ab" fill-rule="evenodd" d="M60,90 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z M130,90 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z"/>
  <path id="abc" fill-rule="evenodd" d="M60,90 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z M130,90 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z M95,150 a60,60 0 1,0 120,0 a60,60 0 1,0 -120,0 Z"/>
  <g id="outline">
    <rect x="5" y="10" width="300" height="210" rx="10" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="18" y="34" font-weight="bold">U</text>
    <use href="#a" fill="none" stroke="#1f2937" stroke-width="2"/>
    <use href="#b" fill="none" stroke="#1f2937" stroke-width="2"/>
    <use href="#c" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="75" y="75" font-weight="bold">A</text>
    <text x="222" y="75" font-weight="bold">B</text>
    <text x="149" y="198" font-weight="bold">C</text>
  </g>
</defs>

<!-- B △ C -->
<g transform="translate(0,0)">
  <use href="#bc" fill="#93c5fd"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">B △ C</text>
</g>

<!-- A △ B -->
<g transform="translate(325,0)">
  <use href="#ab" fill="#93c5fd"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">A △ B</text>
</g>

<!-- A △ (B △ C): A toggled against B △ C -->
<g transform="translate(0,270)">
  <use href="#abc" fill="#86efac"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">A △ (B △ C)</text>
</g>

<!-- (A △ B) △ C: A △ B toggled against C -->
<g transform="translate(325,270)">
  <use href="#abc" fill="#86efac"/>
  <use href="#outline"/>
  <text x="155" y="245" text-anchor="middle">(A △ B) △ C</text>
</g>
</svg>
